packages:
  - 'apps/web'
  - 'packages/*'

# The settings below moved out of package.json's `pnpm` field, which pnpm 11 no
# longer reads (https://pnpm.io/settings). The override values are unchanged
# from the old location, so resolution and the lockfile are identical.

# Dependencies allowed to run install scripts (pnpm blocks them by default).
# @sentry/cli, esbuild, and unrs-resolver fetch native binaries; es5-ext runs a
# postinstall. pnpm 11 replaced the old `onlyBuiltDependencies` list with this
# `allowBuilds` map.
allowBuilds:
  '@sentry/cli': true
  es5-ext: true
  esbuild: true
  unrs-resolver: true

# Transitive-dependency version pins, mostly CVE remediations (see the
# Dependabot history) plus the esbuild build-fix pin. `brace-expansion@1`,
# `js-yaml@4`, `ws@7`, and `ws@8` are version-scoped selectors so each
# major keeps its own patched floor without capping consumers that need a
# newer major (@redocly/openapi-core 2.46+ wants js-yaml 5; minimatch 10
# wants brace-expansion 5).
overrides:
  postcss: '^8.5.10'
  fast-uri: '^3.1.2'
  shell-quote: '^1.9.0'
  esbuild: '^0.28.1'
  form-data: '^4.0.6'
  js-yaml@4: '^4.2.0'
  brace-expansion@1: '^1.1.18'
  ws@7: '^7.5.11'
  ws@8: '^8.21.0'
  undici: '^7.28.0'

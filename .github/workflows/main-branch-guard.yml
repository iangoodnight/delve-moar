name: Main branch guard

# GitHub's native branch protection cannot enforce "PRs must come from a
# specific branch." ADR 0009 commits us to a model where main accepts only
# release merges from dev (the normal path) or a release/* branch when we
# need to merge dev + main together to side-step a prior squash-merge
# divergence. This workflow rejects any other head ref. Required as a
# status check on main via branch protection.

on:
  pull_request:
    branches: [main]

jobs:
  enforce-release-source:
    name: PRs to main must come from dev or release/*
    runs-on: ubuntu-latest
    steps:
      - name: Check head ref
        run: |
          head="${{ github.head_ref }}"
          case "$head" in
            dev|release/*)
              echo "PR head ref is '$head'. OK."
              ;;
            *)
              echo "::error::PRs to main must come from 'dev' or a 'release/*' branch (got: $head). See ADR 0009."
              exit 1
              ;;
          esac

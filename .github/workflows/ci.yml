name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# A commit that lands on main/dev while also heading an open PR (e.g. a
# dev -> main release, or a back-merge) fires both `push` and
# `pull_request`, running every job twice. Key the concurrency group on
# the source commit SHA so those two events share a group and the
# redundant run is cancelled. Feature-branch pushes never match the
# `push` filter above, so their PRs already run once.
concurrency:
  group: ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  # ── Python API ─────────────────────────────────────────────────────────────
  lint-and-test-api:
    name: API — lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dm
          POSTGRES_PASSWORD: dm_secret
          POSTGRES_DB: delve_moar
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install dependencies
        run: uv sync --group dev

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy .

      - name: pytest
        run: uv run pytest
        env:
          # Auth tests use a real Postgres; conftest derives a dedicated
          # "<db>_test" database from this URL (never the dev database).
          DATABASE_URL: postgresql+asyncpg://dm:dm_secret@localhost:5432/delve_moar

  # ── TypeScript web app ─────────────────────────────────────────────────────
  lint-and-test-web:
    name: Web — lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.10

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: ESLint
        run: pnpm lint

      - name: Prettier check
        run: pnpm prettier --check .

      - name: Vitest
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Build Storybook
        run: pnpm build-storybook

  # ── Go CLI ─────────────────────────────────────────────────────────────────
  lint-and-test-cli:
    name: CLI — lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cli

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/cli/go.mod
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: apps/cli

      - name: go test
        run: go test -race ./...

  # ── Shell scripts ──────────────────────────────────────────────────────────
  test-shell:
    name: Shell — bats
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Bats
        uses: bats-core/bats-action@4.0.0
        with:
          support-install: false
          assert-install: false
          file-install: false
          detik-install: false

      - name: Run bats
        run: bats test/

  # ── OpenAPI gen-types drift check ──────────────────────────────────────────
  gen-types-check:
    name: Gen types — drift check
    runs-on: ubuntu-latest
    needs: [lint-and-test-api]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - uses: pnpm/action-setup@v6.0.10

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/cli/go.mod
          cache: true

      - name: Install oapi-codegen
        run: |
          go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.6.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install API dependencies
        run: uv sync
        working-directory: apps/api

      - name: Run gen_types.sh
        run: bash scripts/gen_types.sh

      - name: Check for drift
        run: |
          git diff --exit-code \
            packages/api-types/src/index.ts \
            packages/api-types/src/zod \
            apps/cli/internal/apiclient/client.gen.go \
          || {
            echo ""
            echo "Generated types are out of date."
            echo "Run 'task gen:types' locally and commit the updated files."
            exit 1
          }

  # ── pre-commit ─────────────────────────────────────────────────────────────
  pre-commit:
    name: pre-commit hooks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install shfmt
        run: |
          go install mvdan.cc/sh/v3/cmd/shfmt@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b /usr/local/bin

      - uses: pnpm/action-setup@v6.0.10

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
        env:
          GOPATH: /home/runner/go

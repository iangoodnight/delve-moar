services:

  # ---------------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # API — FastAPI (hot-reload in dev)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ENV: ${ENV:-development}
      VERSION: ${VERSION:-0.0.1}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Mount source only — packages live in the container's .venv, not here.
      # Uvicorn --reload watches this path for changes.
      - ../apps/api/app:/app/app
    command:
      - uv
      - run
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Web — Vite dev server
  # ---------------------------------------------------------------------------
  web:
    build:
      # Repo root, not apps/web: the web app is a pnpm workspace member and
      # needs the root lockfile + packages/ to install @delve-moar/api-types.
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      # Runs in the user's browser, so it reaches the API via the host-mapped
      # port (localhost), not the compose service name.
      VITE_APP_API_URL: http://localhost:${API_PORT:-8000}
      # Poll for changes so HMR works across the bind mount (macOS Docker does
      # not propagate native FS events); read by vite.config.ts.
      VITE_USE_POLLING: "true"
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      # Mount source only — node_modules lives in the image. Vite watches this
      # for hot-reload, the same way the api service mounts app/.
      - ../apps/web/src:/repo/apps/web/src
    depends_on:
      - api

volumes:
  postgres_data:

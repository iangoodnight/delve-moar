version: "2"

linters:
  default: none
  enable:
    - errcheck      # ensure errors are handled
    - govet         # go vet checks
    - staticcheck   # staticcheck suite (replaces megacheck)
    - revive        # opinionated linter, replaces golint
    - unused        # detect unused code
    - misspell      # common spelling mistakes in comments/strings
    - bodyclose     # HTTP response body close checks
    - nilerr        # return nil instead of error
    - gosec         # security checks (bandit equivalent)
    - godot         # comment punctuation consistency
  settings:
    revive:
      rules:
        - name: exported
          severity: warning
        - name: var-naming
          severity: warning
        - name: package-comments
          disabled: true  # small CLI — package doc comments optional

formatters:
  enable:
    - gofmt         # formatting (fail if not gofmt'd)
    - goimports     # import grouping + formatting
  settings:
    goimports:
      local-prefixes:
        - github.com/iangoodnight/delve-moar

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

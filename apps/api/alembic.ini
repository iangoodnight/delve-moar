[alembic]
# Path to migration scripts, relative to this file's directory.
script_location = alembic

# Naming convention: <rev>_<slug>.py — slug is auto-truncated to 40 chars.
file_template = %%(rev)s_%%(slug)s

# All timestamps in UTC.
timezone = UTC
truncate_slug_length = 40

# Prepend apps/api to sys.path so `app.*` imports resolve in env.py.
prepend_sys_path = .

# sqlalchemy.url is overridden in alembic/env.py from app.config.settings.
# The value here is intentionally a placeholder and is never used.
sqlalchemy.url = driver://user:pass@host/dbname

[post_write_hooks]
# No post-write hooks configured.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

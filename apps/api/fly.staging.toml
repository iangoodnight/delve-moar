# Staging Fly config (ADR 0015). Identical to fly.toml except the app name and
# min_machines_running: staging tolerates cold starts, so its machine may stop
# fully when idle. Deployed by .github/workflows/deploy-staging.yml.
app = 'delvemoar-api-staging'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8000'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  # Staging tolerates cold starts, so let the machine stop fully when idle
  # (prod keeps one warm for uptime; see fly.toml). Near-zero cost at rest.
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    path = '/health'
    timeout = '5s'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

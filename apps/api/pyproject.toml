[project]
name = "delve-moar-api"
version = "0.0.1"
description = "TTRPG utility API — homebrew-first GM tools"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.138.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg>=0.29",
    "alembic>=1.18.5",
    "pydantic-settings>=2.14.2",
    "argon2-cffi>=25.1.0",
    "limits>=5.8.0",
    "aiosmtplib>=5.1.2",
    "sentry-sdk[fastapi]>=2.63.0",
    # Used by the SRD seed script (scripts/seed_srd.py), which runs inside the
    # deployed image; declared directly rather than leaning on
    # fastapi[standard]'s transitive httpx.
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "ruff>=0.15.20",
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

# =============================================================================
# Ruff — linter + formatter
# =============================================================================
[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "N",    # pep8-naming
    "RUF",  # ruff-specific rules
    "PT",   # flake8-pytest-style
    "S",    # flake8-bandit (security)
    "D",    # pydocstyle — docstring conventions
    "TID",  # flake8-tidy-imports — enforce absolute imports
    "FBT",  # flake8-boolean-trap — no positional boolean args
    "PERF", # perflint — performance anti-patterns
    "ERA",  # eradicate — no commented-out code
    "C90",  # mccabe — cyclomatic complexity
    "PIE",  # flake8-pie — miscellaneous best practices
]
ignore = [
    "B008",  # FastAPI Depends pattern uses function calls in default args
    "UP046", # Pydantic v2 does not support PEP 695 generic syntax yet
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", # allow assert in tests
    "S105", # test fixtures use literal tokens/passwords
    "S106", # test fixtures pass literal passwords as kwargs
    "S107", # test fixtures use literal password defaults
    "D",    # docstrings not required in tests
]
"alembic/**" = [
    "D",    # migration boilerplate does not require docstrings
]
"scripts/**" = [
    "ERA001", # section banner comments are not commented-out code
]
"**/__init__.py" = [
    "D104", # package docstrings not required in __init__.py files
]

# =============================================================================
# Mypy — strict type checking
# =============================================================================
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
# Alembic-generated boilerplate uses patterns that conflict with strict mode.
# Application code in app/ is fully typed; migrations are infrastructure.
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

# =============================================================================
# Pytest
# =============================================================================
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
# SQLAlchemy's async layer runs DB I/O through greenlets. Without tracking
# greenlet concurrency, coverage cannot follow an endpoint handler's
# continuation after an awaited DB call, under-reporting routes that are
# in fact fully exercised by the DB-backed tests.
concurrency = ["thread", "greenlet"]

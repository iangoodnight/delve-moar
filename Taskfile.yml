version: "3"

vars:
  API_DIR: apps/api
  CLI_DIR: apps/cli
  WEB_DIR: apps/web

tasks:
  # ── Development ────────────────────────────────────────────────────────────

  dev:
    desc: Start all services via Docker Compose
    cmd: docker compose -f infra/docker-compose.yml --env-file .env up --build

  dev:api:
    desc: Start only postgres + API (skip the web dev server)
    cmd: docker compose -f infra/docker-compose.yml --env-file .env up api --build

  # ── Linting ────────────────────────────────────────────────────────────────

  lint:api:
    desc: Lint and type-check the Python API
    dir: "{{.API_DIR}}"
    cmds:
      - uv run ruff check .
      - uv run mypy .

  lint:web:
    desc: Lint the TypeScript web app
    dir: "{{.WEB_DIR}}"
    cmd: pnpm lint

  lint:cli:
    desc: Lint the Go CLI
    dir: "{{.CLI_DIR}}"
    cmd: golangci-lint run ./...

  lint:shell:
    desc: Lint shell scripts (shellcheck + shfmt check)
    cmds:
      - shellcheck scripts/*.sh
      - shfmt --indent 2 --case-indent --binary-next-line --diff scripts/*.sh

  lint:docs:
    desc: Check committed Markdown formatting (prettier)
    cmd: "git ls-files -z '*.md' | xargs -0 pnpm exec prettier --check"

  lint:
    desc: Lint all services in parallel
    deps: [lint:api, lint:web, lint:cli, lint:shell, lint:docs]

  # ── Formatting ─────────────────────────────────────────────────────────────

  format:api:
    desc: Format the Python API (ruff)
    dir: "{{.API_DIR}}"
    cmd: uv run ruff format .

  format:web:
    desc: Format the TypeScript web app (prettier)
    dir: "{{.WEB_DIR}}"
    cmd: pnpm format

  format:cli:
    desc: Format the Go CLI (gofmt + goimports)
    dir: "{{.CLI_DIR}}"
    cmd: golangci-lint fmt ./...

  format:shell:
    desc: Format shell scripts (shfmt)
    cmd: shfmt --indent 2 --case-indent --binary-next-line --write scripts/*.sh

  format:docs:
    desc: Format committed Markdown (prettier)
    cmd: "git ls-files -z '*.md' | xargs -0 pnpm exec prettier --write"

  format:
    desc: Format all services in parallel
    deps: [format:api, format:web, format:cli, format:shell, format:docs]

  # ── Testing ────────────────────────────────────────────────────────────────

  test:api:
    desc: Run Python API tests
    dir: "{{.API_DIR}}"
    cmd: uv run pytest

  test:web:
    desc: Run web app tests
    dir: "{{.WEB_DIR}}"
    cmd: pnpm test

  test:cli:
    desc: Run Go CLI tests (with race detector)
    dir: "{{.CLI_DIR}}"
    cmd: go test -race ./...

  test:shell:
    desc: Run shell-script unit tests (bats)
    cmd: bats test/

  test:
    desc: Run all tests in parallel
    deps: [test:api, test:web, test:cli, test:shell]

  # ── Building ───────────────────────────────────────────────────────────────

  build:api:
    desc: Build the API Docker image
    cmd: docker build -t dm-api apps/api

  build:web:
    desc: Build the web app
    dir: "{{.WEB_DIR}}"
    cmd: pnpm build

  build:cli:
    desc: Build the CLI binary
    dir: "{{.CLI_DIR}}"
    cmd: go build -o bin/dm .

  build:
    desc: Build all services in parallel
    deps: [build:api, build:web, build:cli]

  # ── Code generation ────────────────────────────────────────────────────────

  gen:types:
    desc: Regenerate API types for web and CLI from the live OpenAPI schema
    cmd: bash scripts/gen_types.sh

  # ── Database ───────────────────────────────────────────────────────────────

  db:up:
    desc: Start only the PostgreSQL container
    cmd: docker compose -f infra/docker-compose.yml --env-file .env up postgres -d

  db:down:
    desc: Stop and remove the PostgreSQL container
    cmd: docker compose -f infra/docker-compose.yml --env-file .env down postgres

  db:migrate:
    desc: Apply all pending Alembic migrations
    dir: "{{.API_DIR}}"
    cmd: uv run alembic upgrade head

  db:rollback:
    desc: Roll back the most recent Alembic migration
    dir: "{{.API_DIR}}"
    cmd: uv run alembic downgrade -1

  db:revision:
    desc: 'Autogenerate an Alembic migration: task db:revision -- "add conditions table"'
    dir: "{{.API_DIR}}"
    preconditions:
      - sh: '[ -n "{{.CLI_ARGS}}" ]'
        msg: 'Provide a message: task db:revision -- "add conditions table"'
    cmd: uv run alembic revision --autogenerate -m {{.CLI_ARGS}}

  db:dump:
    desc: "Logical backup of production Postgres to ./backups (needs PROD_DATABASE_URL; see runbook)"
    cmd: bash scripts/db_backup.sh dump

  db:restore:
    desc: "Restore a dump into a LOCAL database (drill/inspection): task db:restore -- ./backups/x.dump [db]"
    cmd: bash scripts/db_backup.sh restore {{.CLI_ARGS}}

  seed:srd:monsters:
    desc: Seed SRD monsters from dnd5eapi.co
    dir: "{{.API_DIR}}"
    env:
      PYTHONPATH: "."
    cmd: uv run python scripts/seed_srd.py monsters

  seed:srd:spells:
    desc: Seed SRD spells from dnd5eapi.co
    dir: "{{.API_DIR}}"
    env:
      PYTHONPATH: "."
    cmd: uv run python scripts/seed_srd.py spells

  seed:srd:items:
    desc: Seed SRD items (equipment + magic items) from dnd5eapi.co
    dir: "{{.API_DIR}}"
    env:
      PYTHONPATH: "."
    cmd: uv run python scripts/seed_srd.py items

  seed:srd:
    desc: Seed all SRD data — monsters, spells, and items
    dir: "{{.API_DIR}}"
    env:
      PYTHONPATH: "."
    cmd: uv run python scripts/seed_srd.py all

  # ── Developer setup ────────────────────────────────────────────────────────

  setup:brew:
    desc: Install all required tools via Homebrew (contributors + maintainers)
    cmd: brew bundle

  setup:dev:
    desc: "Set up a contributor environment: git hooks, codegen tools, and all app deps"
    preconditions:
      - sh: command -v pre-commit
        msg: "pre-commit not found. Run 'task setup:brew' or install manually."
      - sh: command -v go
        msg: "go not found. Run 'task setup:brew' or install manually."
      - sh: command -v uv
        msg: "uv not found. Run 'task setup:brew' or install manually."
      - sh: command -v pnpm
        msg: "pnpm not found. Run 'task setup:brew' or install manually."
    cmds:
      - pre-commit install
      - pre-commit install --hook-type pre-push
      - pre-commit install --hook-type commit-msg
      - git config commit.template .gitmessage
      - go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.6.0
      - pnpm install
      - cd {{.API_DIR}} && uv sync --group dev
      - cd {{.CLI_DIR}} && go mod download

  setup:maintainer:
    desc: Full maintainer setup — contributor tools + Fly.io and Terraform initialised
    preconditions:
      - sh: command -v fly
        msg: "flyctl not found. Run 'task setup:brew' or install manually."
      - sh: command -v terraform
        msg: "terraform not found. Run 'task setup:brew' or install manually."
    cmds:
      - task: setup:dev
      - task: tf:init

  setup:
    desc: "Alias for setup:dev (see also: setup:maintainer for infra tools)"
    cmds:
      - task: setup:dev

  hooks:install:
    desc: "Alias for setup:dev"
    cmds:
      - task: setup:dev

  # ── Infrastructure (Fly.io) ────────────────────────────────────────────────

  fly:logs:
    desc: Stream live logs from the production API
    cmd: fly logs -a delvemoar-api

  fly:ssh:
    desc: Open an interactive SSH session on a production API machine
    cmd: fly ssh console -a delvemoar-api

  fly:deploy:
    desc: "Manual API deploy: build current HEAD, push, and deploy to Fly.io"
    vars:
      SHA:
        sh: git rev-parse HEAD
    cmds:
      - docker build --platform linux/amd64 -t registry.fly.io/delvemoar-api:{{.SHA}} apps/api
      - flyctl auth docker
      - docker push registry.fly.io/delvemoar-api:{{.SHA}}
      - flyctl deploy --config apps/api/fly.toml --image registry.fly.io/delvemoar-api:{{.SHA}} --ha=false

  fly:migrate:
    desc: Run Alembic upgrade head on the production database via fly ssh
    cmd: fly ssh console -a delvemoar-api -C "uv run alembic upgrade head"

  # ── Infrastructure (Terraform) ────────────────────────────────────────────

  tf:init:
    desc: Initialise the Fly Terraform workspace (run once, or after provider changes)
    dir: infra/terraform/fly
    cmd: terraform init

  tf:plan:
    desc: Preview Fly infrastructure changes
    dir: infra/terraform/fly
    cmd: terraform plan

  tf:apply:
    desc: Apply Fly infrastructure changes
    dir: infra/terraform/fly
    cmd: terraform apply

repos:
  # ── General file hygiene ───────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: check-json
        exclude: (tsconfig.*\.json$)
        stages: [pre-commit]
      - id: check-toml
        stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit]

  # ── Shell — lint (shellcheck-py manages its own binary) ───────────────────
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        stages: [pre-commit]

  # ── Shell — format (requires: brew install shfmt) ─────────────────────────
  - repo: local
    hooks:
      - id: shfmt
        name: shfmt
        language: system
        entry: shfmt
        args: [--indent, "2", --case-indent, --binary-next-line, --write]
        files: \.sh$
        stages: [pre-commit]

  # ── Python — ruff handles both lint and format ────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^apps/api/
        stages: [pre-commit]
      - id: ruff-format
        files: ^apps/api/
        stages: [pre-commit]

  # ── Go — lint (requires golangci-lint in PATH) ────────────────────────────
  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint (cli)
        language: system
        entry: bash -c 'cd apps/cli && golangci-lint run ./...'
        files: ^apps/cli/.*\.go$
        pass_filenames: false
        stages: [pre-commit]

  # ── TypeScript / web ──────────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: eslint-web
        name: eslint (web)
        language: system
        entry: scripts/precommit-web.sh eslint
        files: ^apps/web/src/.*\.(ts|tsx)$
        stages: [pre-commit]

      - id: prettier-web
        name: prettier (web)
        language: system
        entry: scripts/precommit-web.sh prettier
        files: ^apps/web/.*\.(ts|tsx|css|json)$
        stages: [pre-commit]

  # ── Markdown — format (prettier, proseWrap at 80) ─────────────────────────
  - repo: local
    hooks:
      - id: prettier-docs
        name: prettier (docs)
        language: system
        entry: pnpm exec prettier --write
        files: \.md$
        exclude: ^planning/
        stages: [pre-commit]

  # ── Commit message — commitlint ──────────────────────────────────────────
  - repo: local
    hooks:
      - id: commitlint
        name: commitlint
        language: system
        entry: ./node_modules/.bin/commitlint --edit
        stages: [commit-msg]

  # ── Tests (pre-push only) ─────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: test-api
        name: pytest (api)
        language: system
        entry: bash -c 'cd apps/api && uv run pytest'
        pass_filenames: false
        stages: [pre-push]

      - id: test-web
        name: vitest (web)
        language: system
        entry: pnpm --filter @delve-moar/web test
        pass_filenames: false
        stages: [pre-push]

      - id: test-cli
        name: go test (cli)
        language: system
        entry: bash -c 'cd apps/cli && go test -race ./...'
        pass_filenames: false
        stages: [pre-push]
